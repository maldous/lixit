services:
  # PgBouncer for connection pooling
  pgbouncer:
    image: edoburu/pgbouncer:latest
    environment:
      - DATABASES_HOST=postgres
      - DATABASES_PORT=5432
      - DATABASES_USER=lixit
      - DATABASES_PASSWORD=lixit_dev_password
      - DATABASES_DBNAME=lixit
      - POOL_MODE=transaction
      - MAX_CLIENT_CONN=100
      - DEFAULT_POOL_SIZE=25
    ports:
      - "6432:5432"
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 64m
    cpus: 0.25

  # GrapesJS Server
  grapesjs-server:
    build:
      context: .
      dockerfile: Dockerfile.grapesjs
    ports:
      - "3005:3000"
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://lixit:lixit_dev_password@pgbouncer:5432/lixit
      - S3_ENDPOINT=http://minio:9000
      - S3_ACCESS_KEY=minioadmin
      - S3_SECRET_KEY=minioadmin123
      - S3_BUCKET=lixit-uploads
      - PORT=3000
    depends_on:
      - pgbouncer
      - minio
    mem_limit: 256m
    cpus: 0.5

  # Local Docker Registry
  registry:
    image: registry:2
    ports:
      - "5000:5000"
    volumes:
      - registry_data:/var/lib/registry
    mem_limit: 256m
    cpus: 0.5

  # MailHog for SMTP testing
  mailhog:
    image: mailhog/mailhog:latest
    ports:
      - "1025:1025"  # SMTP
      - "8025:8025"  # Web UI
    mem_limit: 128m
    cpus: 0.25

  # MkDocs for documentation
  mkdocs:
    image: squidfunk/mkdocs-material:latest
    ports:
      - "8001:8000"
    volumes:
      - ./docs:/docs
    command: serve --dev-addr=0.0.0.0:8000
    mem_limit: 128m
    cpus: 0.25

  # Prometheus for metrics collection
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=7d'
      - '--web.enable-lifecycle'
    mem_limit: 512m
    cpus: 0.5

  # Grafana for visualization
  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_SMTP_ENABLED=true
      - GF_SMTP_HOST=mailhog:1025
      - GF_SMTP_FROM_ADDRESS=grafana@lixit.local
    volumes:
      - grafana_data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      - mailhog
    mem_limit: 256m
    cpus: 0.5

  # Loki for log aggregation
  loki:
    image: grafana/loki:latest
    ports:
      - "3100:3100"
    volumes:
      - ./observability/loki/loki-config.yml:/etc/loki/local-config.yaml
    command: -config.file=/etc/loki/local-config.yaml
    mem_limit: 256m
    cpus: 0.5

  # Promtail for log shipping
  promtail:
    image: grafana/promtail:latest
    volumes:
      - ./observability/promtail/promtail-config.yml:/etc/promtail/config.yml
      - /var/log:/var/log:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    command: -config.file=/etc/promtail/config.yml
    mem_limit: 128m
    cpus: 0.25

  # Jaeger for distributed tracing
  jaeger:
    image: jaegertracing/all-in-one:latest
    ports:
      - "16686:16686"
      - "14268:14268"
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    mem_limit: 256m
    cpus: 0.5

  # Alertmanager for alerts
  alertmanager:
    image: prom/alertmanager:latest
    ports:
      - "9093:9093"
    volumes:
      - ./observability/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    mem_limit: 128m
    cpus: 0.25

  # Keycloak for authentication
  keycloak:
    image: quay.io/keycloak/keycloak:latest
    environment:
      - KEYCLOAK_ADMIN=admin
      - KEYCLOAK_ADMIN_PASSWORD=admin
      - KC_DB=postgres
      - KC_DB_URL=jdbc:postgresql://pgbouncer:5432/keycloak
      - KC_DB_USERNAME=lixit
      - KC_DB_PASSWORD=lixit_dev_password
      - KC_HOSTNAME_STRICT=false
      - KC_HOSTNAME_STRICT_HTTPS=false
    ports:
      - "8080:8080"
    volumes:
      - keycloak_data:/opt/keycloak/data
    depends_on:
      - pgbouncer
      - mailhog
    command: start-dev
    mem_limit: 512m
    cpus: 0.5

  # Caddy for reverse proxy and TLS
  caddy:
    image: caddy:alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      - CADDY_MKCERT=true
    volumes:
      - ./observability/caddy/Caddyfile:/etc/caddy/Caddyfile
      - ./keys:/etc/ssl/certs:ro  # mkcert certificates
      - caddy_data:/data
      - caddy_config:/config
    mem_limit: 128m
    cpus: 0.25

  # RabbitMQ for event bus
  rabbitmq:
    image: rabbitmq:3-management-alpine
    ports:
      - "5672:5672"   # AMQP
      - "15672:15672" # Management UI
    environment:
      - RABBITMQ_DEFAULT_USER=lixit
      - RABBITMQ_DEFAULT_PASS=lixit_dev_password
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
    mem_limit: 256m
    cpus: 0.5

volumes:
  registry_data:
  prometheus_data:
  grafana_data:
  caddy_data:
  caddy_config:
  keycloak_data:
  rabbitmq_data:
