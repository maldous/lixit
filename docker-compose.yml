version: '3.8'

services:
  # Database
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: lixit
      POSTGRES_USER: lixit
      POSTGRES_PASSWORD: lixit_dev_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lixit"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 512m
    cpus: 1.0

  # Redis for queues and caching
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 256m
    cpus: 0.5

  # MinIO for S3-compatible storage
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    mem_limit: 256m
    cpus: 0.5

  # Web Application
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    ports:
      - "8000:3000"
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_URL=http://localhost:3001
    depends_on:
      - api
    read_only: true
    tmpfs:
      - /tmp
      - /app/.next/cache
    mem_limit: 512m
    cpus: 1.0

  # API Service
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "3001:3000"
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://lixit:lixit_dev_password@postgres:5432/lixit
      - REDIS_URL=redis://redis:6379
      - S3_ENDPOINT=http://minio:9000
      - S3_ACCESS_KEY=minioadmin
      - S3_SECRET_KEY=minioadmin123
      - S3_BUCKET=lixit-uploads
      - PORT=3000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    mem_limit: 512m
    cpus: 1.0

  # Document Renderer Service
  doc-renderer:
    build:
      context: .
      dockerfile: Dockerfile.services
    command: ["node", "services/doc-renderer/dist/main.js"]
    ports:
      - "3002:3000"
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://lixit:lixit_dev_password@postgres:5432/lixit
      - REDIS_URL=redis://redis:6379
      - S3_ENDPOINT=http://minio:9000
      - S3_ACCESS_KEY=minioadmin
      - S3_SECRET_KEY=minioadmin123
      - S3_BUCKET=lixit-uploads
      - PORT=3000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    mem_limit: 512m
    cpus: 1.0

  # LIXI Transform Service
  lixi-transform:
    build:
      context: .
      dockerfile: Dockerfile.services
    command: ["node", "services/lixi-transform/dist/main.js"]
    ports:
      - "3003:3000"
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://lixit:lixit_dev_password@postgres:5432/lixit
      - REDIS_URL=redis://redis:6379
      - PORT=3000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    mem_limit: 256m
    cpus: 0.5

  # Submission Broker Service
  submission-broker:
    build:
      context: .
      dockerfile: Dockerfile.services
    command: ["node", "services/submission-broker/dist/main.js"]
    ports:
      - "3004:3000"
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://lixit:lixit_dev_password@postgres:5432/lixit
      - REDIS_URL=redis://redis:6379
      - PORT=3000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    mem_limit: 256m
    cpus: 0.5

  # PII Redaction Service
  pii-redaction:
    build:
      context: services/pii-redaction
      dockerfile: Dockerfile
    ports:
      - "3006:3000"
    environment:
      - NODE_ENV=development
      - PORT=3000
      - REDIS_URL=redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    mem_limit: 512m
    cpus: 1.0

  # Database backup service
  backup:
    image: postgres:15-alpine
    environment:
      PGPASSWORD: lixit_dev_password
    volumes:
      - ./backups:/backups
      - ./scripts/backup.sh:/backup.sh
    command: >
      sh -c "
        while true; do
          sleep 86400
          pg_dumpall -h postgres -U lixit > /backups/backup_$$(date +%Y%m%d_%H%M%S).sql
          find /backups -name '*.sql' -mtime +7 -delete
          # Test backup integrity weekly
          if [ $$(date +%u) -eq 1 ]; then
            pg_restore --list /backups/backup_$$(date +%Y%m%d_%H%M%S).sql > /dev/null 2>&1 || echo 'Backup integrity check failed'
          fi
        done
      "
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 128m
    cpus: 0.25

volumes:
  postgres_data:
  redis_data:
  minio_data:
  keycloak_data: